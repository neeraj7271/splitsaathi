# Build-only check for mobile changes on pull requests.
# Catches broken Android release builds before merge — no GCP upload or broadcast.
#
# Required repository secret:
#   MOBILE_GOOGLE_SERVICES_JSON  (or MOBILE_GOOGLE_SERVICES_JSON_B64)
#
# Note: secrets are not available to workflows from fork PRs.

name: Build Mobile APK (PR)

on:
  pull_request:
    branches:
      - main
      - master
      - dev
    paths:
      - "apps/mobile/**"
      - "scripts/build-apk.js"
      - "scripts/version-utils.js"
      - "scripts/ci-prepare-mobile-build.sh"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: build-mobile-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: ${{ runner.os }}-gradle-mobile-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-mobile-

      - name: Install dependencies
        run: npm ci

      - name: Prepare mobile build secrets
        env:
          MOBILE_GOOGLE_SERVICES_JSON: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON }}
          MOBILE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON_B64 }}
        run: bash scripts/ci-prepare-mobile-build.sh

      - name: Build production APK
        env:
          CI: true
        run: node scripts/build-apk.js prod

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitSaathi-pr-${{ github.event.pull_request.number || github.run_number }}
          path: deploy/SplitSaathi.apk
          retention-days: 7
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          if [[ -f apps/mobile/version.json ]]; then
            VERSION_NAME="$(node -p "require('./apps/mobile/version.json').versionName")"
            VERSION_CODE="$(node -p "require('./apps/mobile/version.json').versionCode")"
            echo "## Mobile PR build" >> "$GITHUB_STEP_SUMMARY"
            echo "- versionName: \`${VERSION_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- versionCode: \`${VERSION_CODE}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- artifact: \`SplitSaathi-pr-${{ github.event.pull_request.number || github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  fork-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Skip fork PR build
        run: |
          echo "## Mobile PR build skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Fork PRs cannot access repository secrets (google-services.json)." >> "$GITHUB_STEP_SUMMARY"
          echo "Maintainers can run \`Build Mobile APK (PR)\` manually via workflow_dispatch after checkout." >> "$GITHUB_STEP_SUMMARY"
